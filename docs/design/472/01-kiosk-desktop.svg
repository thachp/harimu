<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Inter, DejaVu Sans, sans-serif" role="img" aria-label="Reward kiosk in the wallet dialog, desktop, claimable state"><title>Reward kiosk in the wallet dialog, desktop, claimable state</title><rect width="1280" height="800" fill="#f7f5ef"/><text x="20" y="28" font-size="14" font-weight="bold" fill="#1d2a2e" text-anchor="start">#472 wireframe 1 — Reward kiosk in the wallet dialog, 1280×800 (claimable state)</text><rect x="330" y="50" width="620" height="720" rx="6" fill="#ffffff" stroke="#5b6b70"/><text x="350" y="82" font-size="18" font-weight="bold" fill="#1d2a2e" text-anchor="start">Wallet</text><text x="930" y="82" font-size="16" font-weight="normal" fill="#1d2a2e" text-anchor="end">✕</text><rect x="350" y="96" width="280" height="56" rx="6" fill="#eef3f2" stroke="#5b6b70"/><text x="362" y="118" font-size="11" font-weight="normal" fill="#1d2a2e" text-anchor="start">Spark</text><text x="362" y="140" font-size="16" font-weight="bold" fill="#1d2a2e" text-anchor="start">40.00 SPK</text><rect x="650" y="96" width="280" height="56" rx="6" fill="#eef3f2" stroke="#5b6b70"/><text x="662" y="118" font-size="11" font-weight="normal" fill="#1d2a2e" text-anchor="start">Tessera (testnet)</text><text x="662" y="140" font-size="16" font-weight="bold" fill="#1d2a2e" text-anchor="start">12.50 TSR</text><circle cx="940" cy="110" r="9" fill="#b5462e"/><text x="940" y="114" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">1</text><rect x="350" y="170" width="580" height="36" rx="6" fill="#fff7df" stroke="#c9a64a"/><text x="362" y="193" font-size="11" font-weight="normal" fill="#1d2a2e" text-anchor="start">Testnet pilot: no real money. Rewards are earn-only and cannot be cashed out.</text><circle cx="940" cy="186" r="9" fill="#b5462e"/><text x="940" y="190" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">2</text><text x="350" y="236" font-size="15" font-weight="bold" fill="#1d2a2e" text-anchor="start">Reward kiosk</text><circle cx="460" cy="231" r="9" fill="#b5462e"/><text x="460" y="235" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">3</text><text x="350" y="256" font-size="11" font-weight="normal" fill="#44545a" text-anchor="start">Claim what you earned and read your history. Rewards are capped and paid only for verified work.</text><text x="350" y="284" font-size="11" font-weight="bold" fill="#1d2a2e" text-anchor="start">Ready to claim: 2.00 TSR · Claimed so far: 10.50 TSR · Pilot cap 50.00 TSR</text><circle cx="940" cy="280" r="9" fill="#b5462e"/><text x="940" y="284" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">4</text><rect x="350" y="296" width="580" height="96" rx="6" fill="#ffffff" stroke="#5b6b70"/><text x="362" y="324" font-size="10" font-weight="bold" fill="#1f6b4a" text-anchor="start">Earned</text><text x="420" y="324" font-size="11" font-weight="normal" fill="#1d2a2e" text-anchor="start">Oct 22 UTC · Harvest shift, Forgehaven</text><text x="752" y="324" font-size="11" font-weight="bold" fill="#1d2a2e" text-anchor="end">1.25 TSR</text><rect x="770" y="306" width="150" height="32" rx="6" fill="#1f4a55" stroke="#1f4a55"/><text x="845.0" y="326" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Claim reward</text><text x="362" y="368" font-size="10" font-weight="bold" fill="#1f6b4a" text-anchor="start">Earned</text><text x="420" y="368" font-size="11" font-weight="normal" fill="#1d2a2e" text-anchor="start">Oct 21 UTC · Work-yard shift, Forgehaven</text><text x="752" y="368" font-size="11" font-weight="bold" fill="#1d2a2e" text-anchor="end">0.75 TSR</text><rect x="770" y="350" width="150" height="32" rx="6" fill="#1f4a55" stroke="#1f4a55"/><text x="845.0" y="370" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Claim reward</text><circle cx="940" cy="330" r="9" fill="#b5462e"/><text x="940" y="334" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">5</text><text x="350" y="420" font-size="13" font-weight="bold" fill="#1d2a2e" text-anchor="start">Reward history</text><rect x="350" y="430" width="580" height="150" rx="6" fill="#ffffff" stroke="#5b6b70"/><text x="362" y="450" font-size="10" font-weight="bold" fill="#1d2a2e" text-anchor="start">Day</text><text x="500" y="450" font-size="10" font-weight="bold" fill="#1d2a2e" text-anchor="start">Provenance</text><text x="918" y="450" font-size="10" font-weight="bold" fill="#1d2a2e" text-anchor="end">Amount (TSR)</text><text x="362" y="474" font-size="11" font-weight="normal" fill="#1d2a2e" text-anchor="start">Oct 20 UTC</text><text x="500" y="474" font-size="11" font-weight="bold" fill="#1f6b4a" text-anchor="start">Earned</text><text x="918" y="474" font-size="11" font-weight="normal" fill="#1d2a2e" text-anchor="end">+3.00</text><text x="362" y="500" font-size="11" font-weight="normal" fill="#1d2a2e" text-anchor="start">Oct 18 UTC</text><text x="500" y="500" font-size="11" font-weight="bold" fill="#1f6b4a" text-anchor="start">Earned</text><text x="918" y="500" font-size="11" font-weight="normal" fill="#1d2a2e" text-anchor="end">+7.50</text><text x="362" y="526" font-size="11" font-weight="normal" fill="#1d2a2e" text-anchor="start">Oct 12 UTC</text><text x="500" y="526" font-size="11" font-weight="normal" fill="#7a5a10" text-anchor="start">Starter grant</text><text x="918" y="526" font-size="11" font-weight="normal" fill="#1d2a2e" text-anchor="end">+5.00</text><text x="362" y="552" font-size="11" font-weight="normal" fill="#1d2a2e" text-anchor="start">Oct 11 UTC</text><text x="500" y="552" font-size="11" font-weight="normal" fill="#7a5a10" text-anchor="start">Faucet (not earned)</text><text x="918" y="552" font-size="11" font-weight="normal" fill="#1d2a2e" text-anchor="end">+10.00</text><circle cx="940" cy="500" r="9" fill="#b5462e"/><text x="940" y="504" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">6</text><text x="350" y="604" font-size="11" font-weight="normal" fill="#44545a" text-anchor="start">Spark stays in the world. The kiosk only pays out rewards you have earned.</text><circle cx="940" cy="600" r="9" fill="#b5462e"/><text x="940" y="604" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">7</text><rect x="350" y="624" width="580" height="40" rx="6" fill="#f1f1f1" stroke="#9aa6a9" stroke-dasharray="5 4"/><text x="362" y="649" font-size="11" font-weight="normal" fill="#7a8689" text-anchor="start">Spark → Tessera exchange: not available in the pilot (no button, no rate shown)</text><circle cx="940" cy="644" r="9" fill="#b5462e"/><text x="940" y="648" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">8</text><text x="980" y="300" font-size="10" font-weight="normal" fill="#b5462e" text-anchor="start">1 Balance tile names the testnet unit.</text><text x="980" y="322" font-size="10" font-weight="normal" fill="#b5462e" text-anchor="start">2 Testnet disclaimer, always above the kiosk.</text><text x="980" y="344" font-size="10" font-weight="normal" fill="#b5462e" text-anchor="start">3 Title/intro per nation voice (#525).</text><text x="980" y="366" font-size="10" font-weight="normal" fill="#b5462e" text-anchor="start">4 Totals + the cap figure from the server.</text><text x="980" y="388" font-size="10" font-weight="normal" fill="#b5462e" text-anchor="start">5 One button per row; accessible name names amount + work.</text><text x="980" y="410" font-size="10" font-weight="normal" fill="#b5462e" text-anchor="start">6 History: provenance column, earned vs not earned.</text><text x="980" y="432" font-size="10" font-weight="normal" fill="#b5462e" text-anchor="start">7 Spark note (#525).</text><text x="980" y="454" font-size="10" font-weight="normal" fill="#b5462e" text-anchor="start">8 Exchange stays absent (Decision 111).</text></svg>
