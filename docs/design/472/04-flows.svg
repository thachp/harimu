<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" font-family="Inter, DejaVu Sans, sans-serif" role="img" aria-label="Entry and claim flows"><title>Entry and claim flows</title><rect width="1280" height="680" fill="#f7f5ef"/><text x="20" y="28" font-size="14" font-weight="bold" fill="#1d2a2e" text-anchor="start">#472 wireframe 4 — Flows</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5b6b70"/></marker></defs><text x="40" y="70" font-size="13" font-weight="bold" fill="#1d2a2e" text-anchor="start">A. Entry</text><rect x="40" y="90" width="200" height="44" rx="6" fill="#ffffff" stroke="#5b6b70"/><text x="140.0" y="117" font-size="11" font-weight="bold" fill="#1d2a2e" text-anchor="middle">Landing (testnet)</text><line x1="240" y1="112" x2="320" y2="112" stroke="#5b6b70" stroke-width="1.5" marker-end="url(#a)"/><text x="286.0" y="108.0" font-size="10" font-weight="normal" fill="#44545a" text-anchor="start">Explore</text><rect x="320" y="90" width="200" height="44" rx="6" fill="#ffffff" stroke="#5b6b70"/><text x="420.0" y="117" font-size="11" font-weight="bold" fill="#1d2a2e" text-anchor="middle">World (guest)</text><line x1="140" y1="134" x2="140" y2="190" stroke="#5b6b70" stroke-width="1.5" marker-end="url(#a)"/><text x="146.0" y="158.0" font-size="10" font-weight="normal" fill="#44545a" text-anchor="start">Sign in</text><rect x="40" y="190" width="200" height="44" rx="6" fill="#fff7df" stroke="#5b6b70"/><text x="140.0" y="217" font-size="11" font-weight="bold" fill="#1d2a2e" text-anchor="middle">Signed in, not verified</text><line x1="240" y1="212" x2="320" y2="212" stroke="#5b6b70" stroke-width="1.5" marker-end="url(#a)"/><text x="286.0" y="208.0" font-size="10" font-weight="normal" fill="#44545a" text-anchor="start">Verify</text><rect x="320" y="190" width="200" height="44" rx="6" fill="#ffffff" stroke="#5b6b70"/><text x="420.0" y="217" font-size="11" font-weight="bold" fill="#1d2a2e" text-anchor="middle">World ID flow (external)</text><line x1="520" y1="212" x2="600" y2="212" stroke="#5b6b70" stroke-width="1.5" marker-end="url(#a)"/><text x="566.0" y="208.0" font-size="10" font-weight="normal" fill="#44545a" text-anchor="start">verified</text><rect x="600" y="190" width="200" height="44" rx="6" fill="#eef3f2" stroke="#5b6b70"/><text x="700.0" y="217" font-size="11" font-weight="bold" fill="#1d2a2e" text-anchor="middle">Choose nation → citizen</text><line x1="420" y1="234" x2="420" y2="290" stroke="#5b6b70" stroke-width="1.5" marker-end="url(#a)"/><text x="426.0" y="258.0" font-size="10" font-weight="normal" fill="#44545a" text-anchor="start">fail / cancel</text><rect x="320" y="290" width="200" height="44" rx="6" fill="#fff7df" stroke="#5b6b70"/><text x="420.0" y="317" font-size="11" font-weight="bold" fill="#1d2a2e" text-anchor="middle">Back, still not verified</text><text x="40" y="400" font-size="13" font-weight="bold" fill="#1d2a2e" text-anchor="start">B. Claim</text><rect x="40" y="420" width="200" height="44" rx="6" fill="#ffffff" stroke="#5b6b70"/><text x="140.0" y="447" font-size="11" font-weight="bold" fill="#1d2a2e" text-anchor="middle">Wallet → Reward kiosk</text><line x1="240" y1="442" x2="320" y2="442" stroke="#5b6b70" stroke-width="1.5" marker-end="url(#a)"/><rect x="320" y="420" width="200" height="44" rx="6" fill="#ffffff" stroke="#5b6b70"/><text x="420.0" y="447" font-size="11" font-weight="bold" fill="#1d2a2e" text-anchor="middle">Verified?</text><line x1="420" y1="464" x2="420" y2="520" stroke="#5b6b70" stroke-width="1.5" marker-end="url(#a)"/><text x="426.0" y="488.0" font-size="10" font-weight="normal" fill="#44545a" text-anchor="start">no</text><rect x="320" y="520" width="220" height="44" rx="6" fill="#fff7df" stroke="#5b6b70"/><text x="430.0" y="547" font-size="11" font-weight="bold" fill="#1d2a2e" text-anchor="middle">State: World ID not verified</text><line x1="520" y1="442" x2="600" y2="442" stroke="#5b6b70" stroke-width="1.5" marker-end="url(#a)"/><text x="566.0" y="438.0" font-size="10" font-weight="normal" fill="#44545a" text-anchor="start">yes</text><rect x="600" y="420" width="200" height="44" rx="6" fill="#ffffff" stroke="#5b6b70"/><text x="700.0" y="447" font-size="11" font-weight="bold" fill="#1d2a2e" text-anchor="middle">Claimable rows?</text><line x1="700" y1="464" x2="700" y2="520" stroke="#5b6b70" stroke-width="1.5" marker-end="url(#a)"/><text x="706.0" y="488.0" font-size="10" font-weight="normal" fill="#44545a" text-anchor="start">none</text><rect x="600" y="520" width="200" height="44" rx="6" fill="#f1f1f1" stroke="#5b6b70"/><text x="700.0" y="547" font-size="11" font-weight="bold" fill="#1d2a2e" text-anchor="middle">Empty / Capped / Not open</text><line x1="800" y1="442" x2="880" y2="442" stroke="#5b6b70" stroke-width="1.5" marker-end="url(#a)"/><text x="846.0" y="438.0" font-size="10" font-weight="normal" fill="#44545a" text-anchor="start">Claim</text><rect x="880" y="420" width="200" height="44" rx="6" fill="#ffffff" stroke="#5b6b70"/><text x="980.0" y="447" font-size="11" font-weight="bold" fill="#1d2a2e" text-anchor="middle">Pending (button busy)</text><line x1="980" y1="464" x2="980" y2="520" stroke="#5b6b70" stroke-width="1.5" marker-end="url(#a)"/><rect x="880" y="520" width="300" height="44" rx="6" fill="#eef3f2" stroke="#5b6b70"/><text x="1030.0" y="547" font-size="11" font-weight="bold" fill="#1d2a2e" text-anchor="middle">Claimed → history / Error → retry</text><text x="40" y="640" font-size="11" font-weight="normal" fill="#b5462e" text-anchor="start">Rules: the exchange never appears; provenance is server-labelled (Earned / Starter grant / Faucet); a claim never changes Spark.</text></svg>
