<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="800" viewBox="0 0 1290 800" font-family="Inter, DejaVu Sans, sans-serif" role="img" aria-label="Standalone web entry for the testnet pilot"><title>Standalone web entry for the testnet pilot</title><rect width="1290" height="800" fill="#f7f5ef"/><text x="20" y="28" font-size="14" font-weight="bold" fill="#1d2a2e" text-anchor="start">#472 wireframe 3 — Standalone web entry for the testnet pilot (1280 and 390)</text><rect x="20" y="50" width="820" height="720" rx="6" fill="#ffffff" stroke="#5b6b70"/><text x="40" y="84" font-size="20" font-weight="bold" fill="#1d2a2e" text-anchor="start">HARIMU</text><rect x="640" y="64" width="180" height="28" rx="6" fill="#fff7df" stroke="#c9a64a"/><text x="650" y="83" font-size="11" font-weight="bold" fill="#1d2a2e" text-anchor="start">TESTNET PILOT [P]</text><text x="40" y="140" font-size="16" font-weight="bold" fill="#1d2a2e" text-anchor="start">A persistent world of ten nations led by AI. [existing tagline, confirm]</text><rect x="40" y="170" width="380" height="250" rx="6" fill="#eef3f2" stroke="#5b6b70"/><text x="56" y="198" font-size="14" font-weight="bold" fill="#1d2a2e" text-anchor="start">Explore without an ID</text><text x="56" y="222" font-size="11" font-weight="normal" fill="#1d2a2e" text-anchor="start">Look around the world, cities and news.</text><text x="56" y="240" font-size="11" font-weight="normal" fill="#1d2a2e" text-anchor="start">No sign-in needed. (Decision 70) [P]</text><rect x="56" y="370" width="348" height="32" rx="6" fill="#1f4a55" stroke="#1f4a55"/><text x="230.0" y="390" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Explore the world</text><rect x="440" y="170" width="380" height="250" rx="6" fill="#eef3f2" stroke="#5b6b70"/><text x="456" y="198" font-size="14" font-weight="bold" fill="#1d2a2e" text-anchor="start">Become a citizen</text><text x="456" y="222" font-size="11" font-weight="normal" fill="#1d2a2e" text-anchor="start">Sign in, then verify you are a unique human</text><text x="456" y="240" font-size="11" font-weight="normal" fill="#1d2a2e" text-anchor="start">with World ID to join a nation, vote and</text><text x="456" y="258" font-size="11" font-weight="normal" fill="#1d2a2e" text-anchor="start">claim earned rewards. [P]</text><rect x="456" y="330" width="348" height="32" rx="6" fill="#1f4a55" stroke="#1f4a55"/><text x="630.0" y="350" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Sign in</text><rect x="456" y="370" width="348" height="32" rx="6" fill="#ffffff" stroke="#1f4a55"/><text x="630.0" y="390" font-size="12" font-weight="bold" fill="#1d2a2e" text-anchor="middle">Verify with World ID</text><rect x="40" y="440" width="780" height="120" rx="6" fill="#fff7df" stroke="#c9a64a"/><text x="56" y="466" font-size="13" font-weight="bold" fill="#1d2a2e" text-anchor="start">What the pilot is [P]</text><text x="56" y="490" font-size="11" font-weight="normal" fill="#1d2a2e" text-anchor="start">• Test network only: no real money, no purchases, no cash-out.</text><text x="56" y="510" font-size="11" font-weight="normal" fill="#1d2a2e" text-anchor="start">• Tessera here is earn-only: capped rewards for verified work.</text><text x="56" y="530" font-size="11" font-weight="normal" fill="#1d2a2e" text-anchor="start">• This web pilot is separate from World App; it is not a World App mini app.</text><text x="40" y="600" font-size="11" font-weight="normal" fill="#44545a" text-anchor="start">Footer: Privacy · Terms · How verification works (links; World ID data stays private, Decision 62) [P]</text><text x="40" y="660" font-size="10" font-weight="normal" fill="#b5462e" text-anchor="start">• Two equal paths: explore (no ID) and citizen (World ID).</text><text x="40" y="682" font-size="10" font-weight="normal" fill="#b5462e" text-anchor="start">• World ID is a step after sign-in, never a wall in front of exploring.</text><text x="40" y="704" font-size="10" font-weight="normal" fill="#b5462e" text-anchor="start">• Testnet badge persists in the top bar of the game after entry.</text><text x="40" y="726" font-size="10" font-weight="normal" fill="#b5462e" text-anchor="start">• No wallet connect, no chain jargon on this page.</text><rect x="880" y="50" width="390" height="720" rx="6" fill="#ffffff" stroke="#5b6b70"/><text x="896" y="80" font-size="16" font-weight="bold" fill="#1d2a2e" text-anchor="start">HARIMU</text><rect x="1150" y="64" width="104" height="24" rx="6" fill="#fff7df" stroke="#c9a64a"/><text x="1158" y="81" font-size="10" font-weight="bold" fill="#1d2a2e" text-anchor="start">TESTNET [P]</text><text x="896" y="120" font-size="13" font-weight="bold" fill="#1d2a2e" text-anchor="start">A persistent world of ten nations</text><text x="896" y="138" font-size="13" font-weight="bold" fill="#1d2a2e" text-anchor="start">led by AI.</text><rect x="896" y="160" width="358" height="170" rx="6" fill="#eef3f2" stroke="#5b6b70"/><text x="908" y="184" font-size="13" font-weight="bold" fill="#1d2a2e" text-anchor="start">Explore without an ID</text><rect x="908" y="280" width="334" height="32" rx="6" fill="#1f4a55" stroke="#1f4a55"/><text x="1075.0" y="300" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Explore the world</text><rect x="896" y="345" width="358" height="210" rx="6" fill="#eef3f2" stroke="#5b6b70"/><text x="908" y="369" font-size="13" font-weight="bold" fill="#1d2a2e" text-anchor="start">Become a citizen</text><rect x="908" y="460" width="334" height="32" rx="6" fill="#1f4a55" stroke="#1f4a55"/><text x="1075.0" y="480" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">Sign in</text><rect x="908" y="502" width="334" height="32" rx="6" fill="#ffffff" stroke="#1f4a55"/><text x="1075.0" y="522" font-size="12" font-weight="bold" fill="#1d2a2e" text-anchor="middle">Verify with World ID</text><rect x="896" y="570" width="358" height="120" rx="6" fill="#fff7df" stroke="#c9a64a"/><text x="908" y="594" font-size="12" font-weight="bold" fill="#1d2a2e" text-anchor="start">What the pilot is [P]</text><text x="908" y="616" font-size="10" font-weight="normal" fill="#1d2a2e" text-anchor="start">Test network only; earn-only Tessera;</text><text x="908" y="632" font-size="10" font-weight="normal" fill="#1d2a2e" text-anchor="start">no purchases or cash-out; separate</text><text x="908" y="648" font-size="10" font-weight="normal" fill="#1d2a2e" text-anchor="start">from World App.</text><text x="896" y="720" font-size="10" font-weight="normal" fill="#b5462e" text-anchor="start">Cards stack; explore first in DOM and visually.</text></svg>
