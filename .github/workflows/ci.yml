name: CI

# Test-only workflow. There is intentionally NO deploy step and no Cloudflare
# secrets here. Production deploys stay manual and are owned by the release owner.

# CI runs only on pushes to dev and release (Patrick, Nov 4 2026); PRs rely on local npm test + tsc.
on:
  push:
    branches: [release, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # No PR runs now; push runs on dev/release always finish so PM can cut from a green commit.
  cancel-in-progress: false

jobs:
  node-tests:
    name: Node tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # 30 min (#949). The 20 min cap was cancelling a shard that had already
    # passed. Run 40686733431 (PR #947, f27b5a9) Node shard 2/2 printed
    # "pass 1616 / fail 0" after 19.6 min of tests and was killed in teardown
    # at 20m20s. On dev 82cf4eb (run 40066838432) shard 2 finished in 19m40s.
    # Same-day node shards range ~13–20m, so 20m has no margin for setup.
    timeout-minutes: 30
    strategy:
      # Finish both shards even if one fails, so every file is exercised.
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: npm
      - run: npm ci
      # Native file sharding: same glob and process isolation as npm test.
      # TAP logs retain per-test durations for profiling; no coverage filters.
      - run: node --experimental-strip-types --test --test-shard=${{ matrix.shard }}/2 tests/*.test.mjs

  # #591: the Postgres suite (HARIMU_TEST_STORAGE=postgres on PGlite), the same files as npm run test:postgres.
  # Sharded like the Node tests; --test-concurrency=1 inside a shard, as in the npm script (PGlite instances are memory-heavy).
  # A prerequisite of `check` since #706: a failing Postgres shard must fail the required gate.
  postgres-tests:
    name: Postgres tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # 60 min (#1061). Not a hang, and not a retry: run 40962877232 (PR #1071,
    # caacff7) cancelled Postgres shards 1/4 and 4/4 at the 45 min cap while
    # tests were still passing (shard 4/4 attempt 2 printed ok 809, largest
    # gap 23s; the aggregate check then failed because the shard was cancelled).
    # --test-shard walks the sorted file list round-robin, so adding
    # tests/army-stance-hide-1061.test.mjs early in that list moved later files
    # onto the previous shard. Shard 4's summed test time became ~1895s.
    # Green dev 4442d00 (run 41255561104) peaked at ~1786s and finished shard
    # 2/4 in 43 min, so 45 had no margin left. #949 raised 30 to 45 for the
    # same reason when the slow shard was only a few minutes past 30.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # #915: real multi-connection Postgres for the concurrency tests (tests/war-limits-postgres.test.mjs, #575).
    # Throwaway runner-local service with a fixed test password; no secrets. Other Postgres tests keep using PGlite.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test --test-concurrency=1 --test-shard=${{ matrix.shard }}/4 tests/*.test.mjs
        env:
          HARIMU_TEST_STORAGE: postgres
          HARIMU_TEST_POSTGRES_URL: postgres://postgres:pw@127.0.0.1:5432/postgres

  validation:
    runs-on: ubuntu-latest
    # actions: write saves the Playwright browser cache. Contents stay read-only.
    permissions:
      contents: read
      actions: write
    # 35 min: playwright install can stall ~13 min on runners (run 39971034691) on top of ~8 min test:layout.
    # #1303: each --with-deps try is capped so a dead apt mirror cannot use this whole budget.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18 # package.json engines: >=22.18.0 (type stripping on by default; scripts import lib .ts)
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12' # scripts/test-sql.py (stdlib + sqlite3 only)

      - run: npm ci

      # The remaining npm run check commands; Node tests run in parallel above.
      - run: npm run test:sql
      - run: npm run lint
      - run: npx tsc --noEmit

      # #186: rendered HUD layout check (real GameShell markup + shipped CSS in headless Chromium).
      # Kept out of `npm test` so local/unit runs stay browser-free.
      # #1303: `playwright install --with-deps` runs apt. A DNS failure for azure.archive.ubuntu.com
      # took ~10 min and failed the job (run 43053560133) even though the layout tests pass.
      - name: Configure apt retries
        run: printf '%s\n' 'Acquire::Retries "5";' 'Acquire::http::Timeout "15";' 'Acquire::https::Timeout "15";' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null

      - name: Playwright version from lockfile
        id: playwright
        run: |
          version=$(node -p "const p=require('./package-lock.json').packages; (p['node_modules/@playwright/test']||p['node_modules/playwright']).version")
          test -n "$version"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # Cap every --with-deps invocation at 3 minutes. The browser-only fallback below is not capped.
      - name: Cap Playwright --with-deps installs
        run: |
          real=$(command -v npx)
          dir="${RUNNER_TEMP}/bin"
          mkdir -p "$dir"
          printf '%s\n' '#!/bin/bash' \
            'if [ "${1:-}" = playwright ] && [ "${2:-}" = install ] && [ "${3:-}" = --with-deps ]; then' \
            "  exec timeout --kill-after=20s 180 $(printf '%q' "$real") \"\$@\"" \
            'fi' \
            "exec $(printf '%q' "$real") \"\$@\"" > "$dir/npx"
          chmod +x "$dir/npx"
          echo "$dir" >> "$GITHUB_PATH"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium || (echo "::warning::playwright install --with-deps attempt 1 failed; retrying" && sleep 10 && npx playwright install --with-deps chromium) || (echo "::warning::playwright install --with-deps attempt 2 failed; retrying" && sleep 20 && npx playwright install --with-deps chromium) || (echo "::warning::apt deps unavailable after 3 attempts; installing Chromium without system packages" && npx playwright install chromium)
      - run: npm run test:layout

  # #884: AI eval gate. Offline (fixture model outputs through each feature's real validator; no model call,
  # no network, no secrets). Runs on every push; on PRs only when prompt/AI/validator files or the evals change.
  ai-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # PRs check out the merge commit; depth 2 brings its first parent (the base tip) for the diff.
          fetch-depth: 2
      - name: Detect AI or prompt changes
        id: changed
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then echo "ai=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files"
          if echo "$files" | grep -qE '^(lib/(ai-[^/]*|[^/]*-ai|[^/]*-copy|daily-briefing|faith|collective-petitions)\.ts|tests/ai-evals/|scripts/eval-ai\.mjs|tests/helpers/local-runtime\.mjs|package(-lock)?\.json|\.github/workflows/ci\.yml)'; then
            echo "ai=true" >> "$GITHUB_OUTPUT"
          else
            echo "ai=false" >> "$GITHUB_OUTPUT"; echo "No AI/prompt changes; eval skipped."
          fi
      - if: steps.changed.outputs.ai == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: npm
      - if: steps.changed.outputs.ai == 'true'
        run: npm ci
      - if: steps.changed.outputs.ai == 'true'
        run: npm run eval:ai

  # Keep the existing required context. A skipped required job can otherwise
  # appear green: explicitly accept only success from every prerequisite.
  # #706: `check` waits for every test job (both Node shards, all four Postgres shards,
  # validation); any failure, cancellation or skip in any shard fails the gate.
  check:
    if: ${{ always() }}
    needs: [node-tests, postgres-tests, validation, ai-evals]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every test job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          for job in node-tests postgres-tests validation ai-evals; do
            result=$(echo "$NEEDS_JSON" | jq -r --arg j "$job" '.[$j].result // "missing"')
            if [ "$result" != success ]; then echo "::error::$job result is $result"; exit 1; fi
          done
