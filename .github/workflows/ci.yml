name: CI

# Test-only workflow. There is intentionally NO deploy step and no Cloudflare
# secrets here. Production deploys stay manual and are owned by the release owner.

on:
  pull_request:
  push:
    branches: [main, release, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs only; push runs on dev always finish so PM can cut from a green commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node-tests:
    name: Node tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Finish both shards even if one fails, so every file is exercised.
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: npm
      - run: npm ci
      # Native file sharding: same glob and process isolation as npm test.
      # TAP logs retain per-test durations for profiling; no coverage filters.
      - run: node --experimental-strip-types --test --test-shard=${{ matrix.shard }}/2 tests/*.test.mjs

  # #591: the Postgres suite (HARIMU_TEST_STORAGE=postgres on PGlite), the same files as npm run test:postgres.
  # Sharded like the Node tests; --test-concurrency=1 inside a shard, as in the npm script (PGlite instances are memory-heavy).
  # A prerequisite of `check` since #706: a failing Postgres shard must fail the required gate.
  postgres-tests:
    name: Postgres tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # #915: real multi-connection Postgres for the concurrency tests (tests/war-limits-postgres.test.mjs, #575).
    # Throwaway runner-local service with a fixed test password; no secrets. Other Postgres tests keep using PGlite.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test --test-concurrency=1 --test-shard=${{ matrix.shard }}/4 tests/*.test.mjs
        env:
          HARIMU_TEST_STORAGE: postgres
          HARIMU_TEST_POSTGRES_URL: postgres://postgres:pw@127.0.0.1:5432/postgres

  validation:
    runs-on: ubuntu-latest
    # 35 min: playwright install can stall ~13 min on runners (run 39971034691) on top of ~8 min test:layout.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18 # package.json engines: >=22.18.0 (type stripping on by default; scripts import lib .ts)
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12' # scripts/test-sql.py (stdlib + sqlite3 only)

      - run: npm ci

      # The remaining npm run check commands; Node tests run in parallel above.
      - run: npm run test:sql
      - run: npm run lint
      - run: npx tsc --noEmit

      # #186: rendered HUD layout check (real GameShell markup + shipped CSS in headless Chromium).
      # Kept out of `npm test` so local/unit runs stay browser-free.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:layout

  # #884: AI eval gate. Offline (fixture model outputs through each feature's real validator; no model call,
  # no network, no secrets). Runs on every push; on PRs only when prompt/AI/validator files or the evals change.
  ai-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # PRs check out the merge commit; depth 2 brings its first parent (the base tip) for the diff.
          fetch-depth: 2
      - name: Detect AI or prompt changes
        id: changed
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then echo "ai=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only HEAD^1 HEAD)
          echo "$files"
          if echo "$files" | grep -qE '^(lib/(ai-[^/]*|[^/]*-ai|[^/]*-copy|daily-briefing|faith|collective-petitions)\.ts|tests/ai-evals/|scripts/eval-ai\.mjs|tests/helpers/local-runtime\.mjs|package(-lock)?\.json|\.github/workflows/ci\.yml)'; then
            echo "ai=true" >> "$GITHUB_OUTPUT"
          else
            echo "ai=false" >> "$GITHUB_OUTPUT"; echo "No AI/prompt changes; eval skipped."
          fi
      - if: steps.changed.outputs.ai == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: npm
      - if: steps.changed.outputs.ai == 'true'
        run: npm ci
      - if: steps.changed.outputs.ai == 'true'
        run: npm run eval:ai

  # Keep the existing required context. A skipped required job can otherwise
  # appear green: explicitly accept only success from every prerequisite.
  # #706: `check` waits for every test job (both Node shards, all four Postgres shards,
  # validation); any failure, cancellation or skip in any shard fails the gate.
  check:
    if: ${{ always() }}
    needs: [node-tests, postgres-tests, validation, ai-evals]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every test job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          for job in node-tests postgres-tests validation ai-evals; do
            result=$(echo "$NEEDS_JSON" | jq -r --arg j "$job" '.[$j].result // "missing"')
            if [ "$result" != success ]; then echo "::error::$job result is $result"; exit 1; fi
          done
