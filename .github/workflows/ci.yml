name: CI

# Test-only workflow. There is intentionally NO deploy step and no Cloudflare
# secrets here. Production deploys stay manual and are owned by the release owner.

on:
  pull_request:
  push:
    branches: [main, release, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: Node tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Finish both shards even if one fails, so every file is exercised.
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Native file sharding: same glob and process isolation as npm test.
      # TAP logs retain per-test durations for profiling; no coverage filters.
      - run: node --experimental-strip-types --test --test-shard=${{ matrix.shard }}/2 tests/*.test.mjs

  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # package.json engines: >=22.13.0
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12' # scripts/test-sql.py (stdlib + sqlite3 only)

      - run: npm ci

      # The remaining npm run check commands; Node tests run in parallel above.
      - run: npm run test:sql
      - run: npm run lint
      - run: npx tsc --noEmit

      # #186: rendered HUD layout check (real GameShell markup + shipped CSS in headless Chromium).
      # Kept out of `npm test` so local/unit runs stay browser-free.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:layout

  # Keep the existing required context. A skipped required job can otherwise
  # appear green: explicitly accept only success from every prerequisite.
  check:
    if: ${{ always() }}
    needs: [node-tests, validation]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every validation job to succeed
        env:
          NODE_TEST_RESULT: ${{ needs.node-tests.result }}
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: test "$NODE_TEST_RESULT" = success && test "$VALIDATION_RESULT" = success
