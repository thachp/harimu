# #177: deploy harimu-preview from the `release` branch only (flow: dev -> release -> main).
# PRs merge into dev, which no longer deploys. PM cuts `release` from dev daily; hotfixes land on
# release and are merged back into dev. Never main, dev or PRs. Production stays manual.
# Uses repository secret NAMES only: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, PREVIEW_DATABASE_ADMIN_URL.
#
# Triggered by the push itself (not by a CI completion event) and runs `npm run check` before migrating, so a
# cancelled or superseded CI run can never silently drop the deploy for the newest release commit.
name: Deploy preview

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      migrate_only:
        description: Apply pending Postgres migrations to preview without deploying
        type: boolean
        default: false

# Queue, never cancel: a run may be mid-migration. GitHub keeps the newest pending run, so the
# newest release commit always gets a run once the current one finishes (#163).
concurrency:
  group: deploy-preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Same-repo guard (#168), adapted to release: only this repository's release branch, by push or dispatch.
  deploy:
    if: >-
      github.ref == 'refs/heads/release' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.event.repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    env:
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check before touching the database
        id: check
        run: npm run check
      - name: Apply pending Postgres migrations (fails closed)
        id: migrate
        env:
          PREVIEW_DATABASE_ADMIN_URL: ${{ secrets.PREVIEW_DATABASE_ADMIN_URL }}
        run: npm run db:postgres:migrate
      - name: Deploy with pinned wrangler (runs the #119 migration guard)
        # Never runs unless the migration step itself succeeded (not failed, not skipped).
        if: success() && steps.migrate.outcome == 'success' && (github.event_name == 'push' || !inputs.migrate_only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_DATABASE_ADMIN_URL: ${{ secrets.PREVIEW_DATABASE_ADMIN_URL }}
        run: |
          set -o pipefail
          npm run deploy 2>&1 | tee deploy.log
          version=$(grep -oE 'Current Version ID: [0-9a-f-]+' deploy.log | tail -1 | cut -d' ' -f4)
          {
            echo "### harimu-preview deployed"
            echo "- Commit: \`$SHA\`"
            echo "- Cloudflare version ID: \`${version:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"
